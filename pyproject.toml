[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senseshift"
version = "0.1.0"
description = "Subject-held-out sensor activity recognition and reliability under device shift"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
deep = ["torch>=2.5,<3"]
test = ["pytest>=8,<10"]

[project.scripts]
senseshift = "senseshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

